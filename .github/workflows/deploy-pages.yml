name: Deploy Open Slide to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          npx vite build web --base "/${REPO_NAME}/" --outDir ../dist --emptyOutDir

      - name: Make routes and assets work on GitHub Pages
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('dist/s/ai-video-planner', { recursive: true });
          fs.copyFileSync('dist/index.html', 'dist/s/ai-video-planner/index.html');
          fs.copyFileSync('dist/index.html', 'dist/404.html');
          NODE

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
