name: Deploy Open Slide to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Make routes and assets work on GitHub Pages
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const repo = process.env.GITHUB_REPOSITORY.split('/')[1];
          const base = `/${repo}/assets/`;
          const targets = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (/\.(html|js|css)$/.test(entry.name)) targets.push(file);
            }
          }

          walk('dist');
          for (const file of targets) {
            const next = fs.readFileSync(file, 'utf8').replaceAll('/assets/', base);
            fs.writeFileSync(file, next);
          }

          fs.copyFileSync('dist/index.html', 'dist/404.html');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
