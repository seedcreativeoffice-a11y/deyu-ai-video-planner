name: Deploy Open Slide to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Open Slide basename for GitHub Pages
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const repo = process.env.GITHUB_REPOSITORY.split('/')[1];
          const file = 'node_modules/@open-slide/core/src/app/app.tsx';
          const source = fs.readFileSync(file, 'utf8');
          fs.writeFileSync(
            file,
            source.replace('<BrowserRouter>', `<BrowserRouter basename="/${repo}">`)
          );
          NODE

      - name: Build
        run: npm run build

      - name: Make routes and assets work on GitHub Pages
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const repo = process.env.GITHUB_REPOSITORY.split('/')[1];
          const base = `/${repo}/assets/`;
          const targets = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (/\.(html|js|css)$/.test(entry.name)) targets.push(file);
            }
          }

          walk('dist');
          for (const file of targets) {
            const next = fs.readFileSync(file, 'utf8').replaceAll('/assets/', base);
            fs.writeFileSync(file, next);
          }

          fs.copyFileSync('dist/index.html', 'dist/404.html');
          NODE

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
